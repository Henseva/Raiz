<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Raiz - Sabor que vem da terra</title>
    <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=Inter:wght@300;400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --dark-green: #2D4A3E;
            --soft-peach: #E9C4A6;
            --light-grey: #D9D9D9;
            --cream: #F5F1E3;
            --terracotta: #D97D54;
            --white: #FFFFFF;
        }

        /* 1. CURSOR PERSONALIZADO (A IDEIA QUE VOCÊ GOSTOU) */
        * { box-sizing: border-box; margin: 0; padding: 0; cursor: none; }
        body { font-family: 'Inter', sans-serif; color: var(--dark-green); background: var(--white); overflow-x: hidden; scroll-behavior: smooth; }

        #custom-cursor {
            width: 20px; height: 20px; border: 2px solid var(--terracotta);
            border-radius: 50%; position: fixed; pointer-events: none;
            z-index: 9999; transition: transform 0.1s ease-out;
            transform: translate(-50%, -50%);
        }

        /* 2. ANIMAÇÕES DE REVELAÇÃO */
        .reveal { opacity: 0; transform: translateY(30px); transition: all 0.8s ease-out; }
        .reveal.active { opacity: 1; transform: translateY(0); }

        /* NAVBAR (ESTILO ORIGINAL DO SEU PRINT) */
        .navbar { 
            background: var(--dark-green); padding: 15px 5%; 
            display: flex; justify-content: space-between; align-items: center; 
            color: var(--white); position: sticky; top: 0; z-index: 1000; 
        }
        .logo { font-family: 'DM Serif Display', serif; font-size: 1.8rem; letter-spacing: 2px; }
        .nav-links a { color: var(--white); text-decoration: none; font-size: 0.85rem; font-weight: bold; margin-left: 20px; }
        .btn-nav { background: var(--terracotta); padding: 10px 20px; border-radius: 6px; }

        /* HERO (COM EFEITO DE ESCRITA) */
        .hero { 
            height: 60vh; 
            background: linear-gradient(rgba(0,0,0,0.5), rgba(0,0,0,0.5)), url('hero.jpg'); 
            background-size: cover; background-position: center; display: flex; align-items: center; justify-content: center; 
        }
        @keyframes typing { from { width: 0 } to { width: 100% } }
        .typing-effect { 
            display: inline-block; overflow: hidden; white-space: nowrap; 
            border-right: 3px solid var(--soft-peach);
            animation: typing 2.5s steps(30, end), blink .75s step-end infinite;
        }
        @keyframes blink { from, to { border-color: transparent } 50% { border-color: var(--soft-peach); } }
        .hero h1 { font-family: 'DM Serif Display', serif; font-size: clamp(1.8rem, 5vw, 4rem); color: var(--white); text-align: center; }

        /* BARRA DE VALORES (MANTIDA) */
        .values-bar { background: var(--soft-peach); display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); padding: 40px 10%; text-align: center; gap: 30px; }

        /* CARDÁPIO (FIEL AO SEU PRINT) */
        .menu-section { background: var(--light-grey); padding: 80px 5%; text-align: center; }
        .menu-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 30px; max-width: 1200px; margin: 0 auto; }
        .card { background: var(--cream); border-radius: 20px; overflow: hidden; display: flex; flex-direction: column; transition: 0.4s; }
        .card-img { height: 250px; background-size: cover; background-position: center; }
        .card-info { padding: 25px 20px; }
        .btn-card { background: #e0e0e0; color: #333; border: 1px solid #999; padding: 12px 30px; border-radius: 8px; font-weight: bold; }

        /* SLIDER DE BEBIDAS (COM AS SUAS IMAGENS ORIGINAIS) */
        .drink-slider-section { padding: 100px 0; text-align: center; background-color: var(--terracotta); }
        .slider-container { display: flex; gap: 25px; padding: 0 10%; overflow-x: auto; scroll-snap-type: x mandatory; }
        .slide { min-width: 300px; background: white; border-radius: 40px; padding: 40px 20px; scroll-snap-align: center; }
        .drink-img { width: 100%; max-height: 200px; object-fit: contain; }

        /* FOOTER (MANTIDO) */
        .main-footer { background: var(--dark-green); color: var(--white); padding: 80px 5% 40px; text-align: center; }
        .ifood-full-btn { background: var(--terracotta); color: white; text-decoration: none; display: block; width: 90%; max-width: 400px; margin: 40px auto; padding: 20px; border-radius: 15px; font-weight: bold; }

        @media (max-width: 768px) { * { cursor: auto; } #custom-cursor { display: none; } }
    </style>
</head>
<body>

    <div id="custom-cursor"></div>

    <nav class="navbar">
        <div class="logo">RAIZ</div>
        <div class="nav-links">
            <a href="#menu">Cardápio</a>
            <a href="#">História</a>
            <a href="#" class="btn-nav">iFood</a>
        </div>
    </nav>

    <header class="hero">
        <h1><span class="typing-effect">Sabor que vem da terra.</span></h1>
    </header>

    <section class="values-bar reveal">
        <div><h3>🌿 Puro</h3><p>Orgânicos locais.</p></div>
        <div><h3>🖐️ Artesanal</h3><p>Feito à mão.</p></div>
        <div><h3>🚲 Consciente</h3><p>Entrega rápida.</p></div>
    </section>

    <section id="menu" class="menu-section reveal">
        <div class="menu-grid">
            <div class="card">
                <div class="card-img" style="background-image: url('burger.jpg');"></div>
                <div class="card-info">
                    <h3>Burger Raiz</h3>
                    <p>Blend bovino 180g e queijo meia cura.</p>
                    <button class="btn-card">Pedir Agora</button>
                </div>
            </div>
        </div>
    </section>

    <section id="especiais" class="drink-slider-section reveal">
        <div class="slider-container">
            <div class="slide">
                <img src="coca.png" class="drink-img"> <h3 style="margin: 15px 0;">Coca-Cola</h3>
                <button class="btn-nav" style="width: 100%;">Pedir Agora</button>
            </div>
            <div class="slide">
                <img src="laranja.png" class="drink-img"> <h3 style="margin: 15px 0;">Laranja</h3>
                <button class="btn-nav" style="width: 100%;">Pedir Agora</button>
            </div>
        </div>
    </section>

    <footer class="main-footer">
        <div class="footer-logo">RAIZ</div>
        <a href="#" class="ifood-full-btn">Peça no iFood</a>
        <p>&copy; 2026 Restaurante Raiz.</p>
    </footer>

    <script>
        const cursor = document.getElementById('custom-cursor');
        document.addEventListener('mousemove', e => {
            cursor.style.top = e.clientY + 'px';
            cursor.style.left = e.clientX + 'px';
        });

        function reveal() {
            document.querySelectorAll(".reveal").forEach(el => {
                if (el.getBoundingClientRect().top < window.innerHeight - 100) el.classList.add("active");
            });
        }
        window.addEventListener("scroll", reveal);
        reveal();
    </script>
</body>
</html>
