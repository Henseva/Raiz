<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Raiz - Sabor que vem da terra</title>
    <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=Inter:wght@300;400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --dark-green: #2D4A3E;
            --soft-peach: #E9C4A6;
            --cream: #F5F1E3;
            --terracotta: #D97D54;
            --white: #FFFFFF;
        }

        /* VOLTANDO COM O CURSOR QUE VOCÊ GOSTOU */
        * { box-sizing: border-box; margin: 0; padding: 0; cursor: none; }
        body { font-family: 'Inter', sans-serif; color: var(--dark-green); background: #f0f0f0; overflow-x: hidden; }

        #custom-cursor {
            width: 20px; height: 20px; border: 2px solid var(--terracotta);
            border-radius: 50%; position: fixed; pointer-events: none;
            z-index: 9999; transition: transform 0.1s ease-out;
            transform: translate(-50%, -50%);
        }

        /* ANIMAÇÕES DE REVELAÇÃO */
        .reveal { opacity: 0; transform: translateY(30px); transition: all 0.8s ease-out; }
        .reveal.active { opacity: 1; transform: translateY(0); }

        /* EFEITO DE ESCRITA NO TÍTULO */
        @keyframes typing { from { width: 0 } to { width: 100% } }
        .typing-effect { 
            display: inline-block; overflow: hidden; white-space: nowrap; 
            border-right: 3px solid var(--soft-peach);
            animation: typing 2.5s steps(30, end), blink .75s step-end infinite;
        }
        @keyframes blink { from, to { border-color: transparent } 50% { border-color: var(--soft-peach); } }

        /* NAVBAR CONFORME SEU PRINT */
        .navbar { 
            background: var(--dark-green); padding: 15px 5%; 
            display: flex; justify-content: space-between; align-items: center; 
            color: var(--white); position: sticky; top: 0; z-index: 1000; 
        }
        .logo { font-family: 'DM Serif Display', serif; font-size: 1.8rem; }
        .btn-nav { background: var(--terracotta); padding: 10px 20px; border-radius: 8px; color: white; border: none; font-weight: bold; text-decoration: none; }

        /* HERO */
        .hero { 
            height: 50vh; 
            background: linear-gradient(rgba(0,0,0,0.5), rgba(0,0,0,0.5)), url('hero.jpg'); 
            background-size: cover; background-position: center; display: flex; align-items: center; justify-content: center; 
        }
        .hero h1 { font-family: 'DM Serif Display', serif; font-size: 2.5rem; color: var(--white); text-align: center; }

        /* CARDÁPIO (ESTILO DO SEU PRINT) */
        .menu-section { padding: 40px 5%; text-align: center; }
        .card { background: var(--cream); border-radius: 25px; overflow: hidden; margin-bottom: 25px; max-width: 450px; margin-inline: auto; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        .card-img { width: 100%; height: 250px; object-fit: cover; display: block; }
        .card-info { padding: 15px; border-top: 1px solid #ddd; }
        .btn-card { background: #e0e0e0; color: #333; border: 1px solid #999; width: 100%; padding: 10px; font-weight: bold; }

        /* SEÇÃO DE BEBIDAS (FUNDO QUE VOCÊ ESCOLHEU) */
        .drink-section { background: var(--terracotta); padding: 50px 5%; text-align: center; }
        .drink-slide { background: white; border-radius: 30px; padding: 25px; display: flex; flex-direction: column; align-items: center; margin-bottom: 20px; }
        .drink-img { width: 100%; max-height: 200px; object-fit: contain; }

        /* FOOTER */
        .main-footer { background: var(--dark-green); color: var(--white); padding: 40px 5%; text-align: center; }
        .ifood-btn { background: var(--terracotta); color: white; text-decoration: none; display: block; padding: 18px; border-radius: 15px; font-weight: bold; margin: 20px 0; }

        /* AJUSTE PARA CELULAR */
        @media (max-width: 768px) {
            * { cursor: auto; }
            #custom-cursor { display: none; }
        }
    </style>
</head>
<body>

    <div id="custom-cursor"></div>

    <nav class="navbar">
        <div class="logo">RAIZ</div>
        <div style="display: flex; gap: 15px; font-weight: bold; font-size: 0.8rem;">
            <span>Cardápio</span> <span>História</span>
            <a href="#" class="btn-nav">iFood</a>
        </div>
    </nav>

    <header class="hero">
        <h1><span class="typing-effect">Sabor que vem da terra.</span></h1>
    </header>

    <section class="menu-section reveal">
        <div class="card">
            <img src="burger.jpg" class="card-img"> <div class="card-info">
                <h3>Burger Raiz</h3>
                <p>Blend bovino 180g e queijo meia cura.</p>
                <button class="btn-card">Pedir Agora</button>
            </div>
        </div>
    </section>

    <section id="especiais" class="drink-section reveal">
        <div class="drink-slide">
            <img src="coca.png" class="drink-img"> <h3 style="margin: 15px 0;">Coca-Cola</h3>
            <button class="btn-nav" style="width: 100%;">Pedir Agora</button>
        </div>
    </section>

    <footer class="main-footer">
        <h2 class="logo">RAIZ</h2>
        <p>Sabor que vem da terra.</p>
        <a href="#" class="ifood-btn">Peça no iFood</a>
        <p style="opacity: 0.5; font-size: 0.8rem;">&copy; 2026 Restaurante Raiz.</p>
    </footer>

    <script>
        // Lógica do Cursor
        const cursor = document.getElementById('custom-cursor');
        document.addEventListener('mousemove', e => {
            cursor.style.top = e.clientY + 'px';
            cursor.style.left = e.clientX + 'px';
        });

        // Lógica de Revelação no Scroll
        function reveal() {
            var reveals = document.querySelectorAll(".reveal");
            reveals.forEach(el => {
                if (el.getBoundingClientRect().top < window.innerHeight - 100) {
                    el.classList.add("active");
                }
            });
        }
        window.addEventListener("scroll", reveal);
        reveal();
    </script>
</body>
</html>
