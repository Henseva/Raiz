<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Raiz - Sabor que vem da terra</title>
    <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=Inter:wght@300;400;700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --dark-green: #2D4A3E;
            --soft-peach: #E9C4A6;
            --light-grey: #D9D9D9;
            --cream: #F5F1E3;
            --terracotta: #D97D54;
            --white: #FFFFFF;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Inter', sans-serif; color: var(--dark-green); background: var(--white); overflow-x: hidden; scroll-behavior: smooth; }

        /* Navbar */
        .navbar { background: var(--dark-green); padding: 15px 5%; display: flex; justify-content: space-between; align-items: center; color: var(--white); position: sticky; top: 0; z-index: 1000; }
        .logo { font-family: 'DM Serif Display', serif; font-size: 1.8rem; }
        .nav-links a { color: var(--white); text-decoration: none; margin-left: 15px; font-size: 0.8rem; font-weight: bold; }
        .btn-nav { background: var(--terracotta); padding: 8px 15px; border-radius: 4px; display: inline-block; }

        /* Hero */
        .hero { 
            height: 50vh; 
            background: linear-gradient(rgba(0,0,0,0.4), rgba(0,0,0,0.4)), url('https://images.unsplash.com/photo-1550547660-d9450f859349?q=80&w=1200'); 
            background-size: cover; background-position: center; display: flex; align-items: center; justify-content: center; padding: 20px;
        }
        .hero h1 { font-family: 'DM Serif Display', serif; font-size: clamp(2.5rem, 8vw, 4rem); color: var(--white); text-align: center; }

        /* Cardápio de Comidas (Mantendo sua estética) */
        .menu-section { background: var(--light-grey); padding: 60px 5%; text-align: center; }
        .menu-section h2 { font-family: 'DM Serif Display', serif; font-size: 2.5rem; margin-bottom: 40px; }
        .menu-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 25px; max-width: 1200px; margin: 0 auto; }
        
        .card { background: var(--cream); border-radius: 15px; overflow: hidden; box-shadow: 0 10px 20px rgba(0,0,0,0.05); display: flex; flex-direction: column; }
        .card-img { height: 220px; background-size: cover; background-position: center; }
        .card-content { padding: 20px; flex-grow: 1; display: flex; flex-direction: column; align-items: center; }
        .card h3 { font-family: 'DM Serif Display', serif; font-size: 1.4rem; margin: 10px 0; }
        .card button { background: var(--terracotta); color: white; border: none; padding: 10px 20px; border-radius: 5px; cursor: pointer; font-weight: bold; }

        /* SEÇÃO ESPECIAIS (Bebidas Lado a Lado - Estética Raiz) */
        .drink-section { 
            padding: 80px 5%; 
            text-align: center; 
            transition: background-color 0.8s ease; 
            background-color: #fce4e4; 
        }
        .drink-section h2 { font-family: 'DM Serif Display', serif; font-size: 2.5rem; margin-bottom: 40px; }
        
        .drink-container { 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            gap: 20px; 
            max-width: 1200px; 
            margin: 0 auto;
            flex-wrap: wrap; /* Garante que no celular elas se ajustem */
        }

        .drink-card {
            background: rgba(255, 255, 255, 0.4);
            backdrop-filter: blur(10px);
            border-radius: 25px;
            padding: 30px 20px;
            width: 280px; /* Tamanho fixo para ficarem alinhadas */
            transition: all 0.5s ease;
            cursor: pointer;
            border: 1px solid rgba(255,255,255,0.4);
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* Efeito de destaque no card ativo */
        .drink-card.active {
            background: white;
            transform: scale(1.05);
            box-shadow: 0 20px 40px rgba(0,0,0,0.1);
        }

        .drink-card img {
            width: 100%;
            max-width: 140px;
            height: 250px;
            object-fit: contain;
            transition: transform 0.5s ease;
            filter: drop-shadow(0 15px 20px rgba(0,0,0,0.1));
        }

        .drink-card.active img {
            transform: translateY(-10px) scale(1.1);
        }

        .drink-card h3 { 
            font-family: 'DM Serif Display', serif; 
            font-size: 1.6rem; 
            margin-top: 15px; 
            color: var(--dark-green); 
        }

        /* Footer */
        .main-footer { background: var(--dark-green); color: var(--white); padding: 40px 5%; text-align: center; }
        .ifood-bar { background: var(--terracotta); padding: 20px; font-weight: bold; font-size: 1.1rem; display: block; text-decoration: none; color: white; }

        @media (max-width: 768px) {
            .drink-container { gap: 15px; }
            .drink-card { width: 45%; padding: 15px; } /* Duas por linha no celular */
            .drink-card img { height: 180px; }
        }
    </style>
</head>
<body>

    <nav class="navbar">
        <div class="logo">RAIZ</div>
        <div class="nav-links">
            <a href="#menu">Cardápio</a>
            <a href="#especiais">Especiais</a>
            <a href="#" class="btn-nav">iFood</a>
        </div>
    </nav>

    <header class="hero">
        <h1>Sabor que vem da terra.</h1>
    </header>

    <section id="menu" class="menu-section">
        <h2>Cardápio Completo</h2>
        <div class="menu-grid">
            <div class="card">
                <div class="card-img" style="background-image: url('https://images.unsplash.com/photo-1568901346375-23c9450c58cd?w=500');"></div>
                <div class="card-content">
                    <h3>Burger Raiz</h3>
                    <button>Pedir Agora</button>
                </div>
            </div>
            <div class="card">
                <div class="card-img" style="background-image: url('https://images.unsplash.com/photo-1512621776951-a57141f2eefd?w=500');"></div>
                <div class="card-content">
                    <h3>Bowl da Estação</h3>
                    <button>Pedir Agora</button>
                </div>
            </div>
        </div>
    </section>

    <section id="especiais" class="drink-section">
        <h2>Especiais da Casa</h2>
        <div class="drink-container">
            
            <div class="drink-card active" onclick="updateView(this, '#e74c3c')">
                <img src="coca.png" alt="Coca-Cola">
                <h3>Coca-Cola</h3>
            </div>

            <div class="drink-card" onclick="updateView(this, '#f39c12')">
                <img src="laranja.png" alt="Laranja">
                <h3>Laranja</h3>
            </div>

            <div class="drink-card" onclick="updateView(this, '#27ae60')">
                <img src="guarana.png" alt="Guaraná">
                <h3>Guaraná</h3>
            </div>

        </div>
    </section>

    <footer class="main-footer">
        <div class="logo">RAIZ</div>
        <a href="#" class="ifood-bar">Peça no iFood</a>
    </footer>

    <script>
        function updateView(element, color) {
            // Remove a classe 'active' de todos
            document.querySelectorAll('.drink-card').forEach(card => {
                card.classList.remove('active');
            });
            
            // Adiciona no clicado
            element.classList.add('active');
            
            // Muda o fundo da seção para a cor da bebida
            document.getElementById('especiais').style.backgroundColor = color;
        }
    </script>
</body>
</html>
