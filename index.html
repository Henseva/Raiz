<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Raiz - Sabor que vem da terra</title>
    <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=Inter:wght@300;400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --dark-green: #2D4A3E;
            --soft-peach: #E9C4A6;
            --light-grey: #D9D9D9;
            --cream: #F5F1E3;
            --terracotta: #D97D54;
            --white: #FFFFFF;
        }

        /* RESET E CURSOR */
        * { box-sizing: border-box; margin: 0; padding: 0; cursor: none; }
        body { font-family: 'Inter', sans-serif; color: var(--dark-green); background: var(--white); overflow-x: hidden; scroll-behavior: smooth; }

        #custom-cursor {
            width: 25px; height: 25px; border: 2px solid var(--terracotta);
            border-radius: 50%; position: fixed; pointer-events: none;
            z-index: 9999; transition: transform 0.1s ease-out, background 0.3s;
            transform: translate(-50%, -50%);
        }

        /* NAVBAR */
        .navbar { 
            background: var(--dark-green); padding: 15px 5%; 
            display: flex; justify-content: space-between; align-items: center; 
            color: var(--white); position: sticky; top: 0; z-index: 1000; 
        }
        .logo { font-family: 'DM Serif Display', serif; font-size: 1.8rem; letter-spacing: 2px; }
        .nav-links a { color: var(--white); text-decoration: none; font-size: 0.85rem; font-weight: bold; margin-left: 20px; }
        .btn-nav { background: var(--terracotta); padding: 10px 20px; border-radius: 6px; }

        /* HERO - COM IMAGEM ESTÁVEL */
        .hero { 
            height: 60vh; 
            background: linear-gradient(rgba(0,0,0,0.5), rgba(0,0,0,0.5)), url('https://images.unsplash.com/photo-1594212699903-ec8a3eca50f5?q=80&w=1200&auto=format&fit=crop'); 
            background-size: cover; background-position: center; display: flex; align-items: center; justify-content: center; 
        }
        .hero h1 { font-family: 'DM Serif Display', serif; font-size: clamp(2rem, 6vw, 4rem); color: var(--white); text-align: center; }

        /* SEÇÃO CARDÁPIO */
        .menu-section { background: var(--light-grey); padding: 60px 5%; text-align: center; }
        .menu-section h2 { font-family: 'DM Serif Display', serif; font-size: 2.5rem; margin-bottom: 40px; color: var(--dark-green); }
        .menu-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 40px; max-width: 1200px; margin: 0 auto; }
        
        .card { background: var(--cream); border-radius: 25px; overflow: hidden; display: flex; flex-direction: column; transition: 0.4s; box-shadow: 0 10px 20px rgba(0,0,0,0.05); }
        .card:hover { transform: translateY(-10px); }
        
        .card-img { height: 280px; background-size: cover; background-position: center; }
        .card-info { padding: 30px 20px; text-align: center; }
        .card h3 { font-family: 'DM Serif Display', serif; font-size: 1.8rem; margin-bottom: 10px; }
        .card p { font-size: 1rem; color: #555; margin-bottom: 25px; }
        
        /* BOTÃO VERMELHO DO MODELO */
        .btn-card { 
            background: var(--terracotta); color: white; border: none; 
            padding: 15px 40px; border-radius: 12px; font-weight: bold; 
            font-size: 1rem; cursor: pointer; transition: 0.3s; align-self: center;
        }
        .btn-card:hover { transform: scale(1.05); filter: brightness(1.1); }

        /* ONDA DINÂMICA */
        .wave-container { background: var(--dark-green); height: 80px; position: relative; z-index: 5; }
        .wave svg { display: block; width: 100%; height: 80px; fill: #fce4e3; }

        /* FOOTER ESTILO FOTO */
        .main-footer { background: var(--dark-green); color: var(--white); padding: 60px 5% 40px; text-align: center; }
        .footer-logo { font-family: 'DM Serif Display', serif; font-size: 3rem; margin-bottom: 10px; }
        .ifood-full-btn { 
            background: var(--terracotta); color: white; text-decoration: none; 
            display: block; width: 100%; max-width: 380px; margin: 40px auto; 
            padding: 22px; border-radius: 18px; font-weight: bold; font-size: 1.3rem; 
        }
        .copyright { font-size: 0.8rem; opacity: 0.5; margin-top: 50px; }

        /* RESPONSIVIDADE CELULAR */
        @media (max-width: 768px) {
            * { cursor: auto; }
            #custom-cursor { display: none; }
            .hero { height: 50vh; }
            .card-img { height: 220px; }
            .nav-links { display: none; }
        }
    </style>
</head>
<body>

    <div id="custom-cursor"></div>

    <nav class="navbar">
        <div class="logo">RAIZ</div>
        <div class="nav-links">
            <a href="#menu">Cardápio</a>
            <a href="#">História</a>
            <a href="#" class="btn-nav">iFood</a>
        </div>
    </nav>

    <header class="hero">
        <h1>Sabor que vem da terra.</h1>
    </header>

    <section id="menu" class="menu-section">
        <h2>Cardápio Completo</h2>
        <div class="menu-grid">
            <div class="card">
                <div class="card-img" style="background-image: url('https://images.unsplash.com/photo-1568901346375-23c9450c58cd?q=80&w=800');"></div>
                <div class="card-info">
                    <h3>Burger Raiz</h3>
                    <p>Blend bovino 180g e queijo meia cura.</p>
                    <button class="btn-card">Pedir Agora</button>
                </div>
            </div>
            <div class="card">
                <div class="card-img" style="background-image: url('https://images.unsplash.com/photo-1512621776951-a57141f2eefd?q=80&w=800');"></div>
                <div class="card-info">
                    <h3>Bowl da Estação</h3>
                    <p>Mix de folhas e grãos ancestrais.</p>
                    <button class="btn-card">Pedir Agora</button>
                </div>
            </div>
        </div>
    </section>

    <div class="wave-container">
        <div class="wave">
            <svg viewBox="0 0 1200 120" preserveAspectRatio="none">
                <path d="M321.39,56.44c58-10.79,114.16-30.13,172-41.86,82.39-16.72,168.19-17.73,250.45-.39C823.78,31,906.67,72,985.66,92.83c70.05,18.48,146.53,26.09,214.34,3V0H0V27.35A600.21,600.21,0,0,0,321.39,56.44Z"></path>
            </svg>
        </div>
    </div>

    <footer class="main-footer">
        <div class="footer-logo">RAIZ</div>
        <p>Sabor que vem da terra.</p>
        <a href="#" class="ifood-full-btn">Peça no iFood</a>
        <div class="copyright">&copy; 2026 Restaurante Raiz.</div>
    </footer>

    <script>
        // Lógica do Cursor
        const cursor = document.getElementById('custom-cursor');
        document.addEventListener('mousemove', e => {
            cursor.style.top = e.clientY + 'px';
            cursor.style.left = e.clientX + 'px';
        });

        document.querySelectorAll('button, a').forEach(el => {
            el.addEventListener('mouseenter', () => cursor.style.transform = 'translate(-50%, -50%) scale(2)');
            el.addEventListener('mouseleave', () => cursor.style.transform = 'translate(-50%, -50%) scale(1)');
        });
    </script>
</body>
</html>
