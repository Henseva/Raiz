<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Raiz - Sabor que vem da terra</title>
    <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=Inter:wght@300;400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --dark-green: #2D4A3E;
            --soft-peach: #E9C4A6;
            --light-grey: #D9D9D9;
            --cream: #F5F1E3;
            --terracotta: #D97D54;
            --white: #FFFFFF;
        }

        /* RESET E CURSOR */
        * { box-sizing: border-box; margin: 0; padding: 0; cursor: none; }
        body { font-family: 'Inter', sans-serif; color: var(--dark-green); background: var(--white); overflow-x: hidden; scroll-behavior: smooth; }

        #custom-cursor {
            width: 20px; height: 20px; border: 2px solid var(--terracotta);
            border-radius: 50%; position: fixed; pointer-events: none;
            z-index: 9999; transition: transform 0.1s ease-out;
            transform: translate(-50%, -50%);
        }

        /* ANIMAÇÕES */
        .reveal { opacity: 0; transform: translateY(30px); transition: all 0.8s ease-out; }
        .reveal.active { opacity: 1; transform: translateY(0); }

        @keyframes typing { from { width: 0 } to { width: 100% } }
        .typing-effect { 
            display: inline-block; overflow: hidden; white-space: nowrap; 
            border-right: 3px solid var(--soft-peach);
            animation: typing 2.5s steps(30, end), blink .75s step-end infinite;
        }

        /* NAVBAR SLIM */
        .navbar { 
            background: var(--dark-green); 
            padding: 10px 5%; 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            color: var(--white); 
            position: sticky; 
            top: 0; 
            z-index: 1000; 
            height: 60px;
        }
        .logo { font-family: 'DM Serif Display', serif; font-size: 1.6rem; letter-spacing: 2px; }
        .nav-links { display: flex; align-items: center; gap: 40px; margin-left: auto; }
        .nav-links a { color: var(--white); text-decoration: none; font-size: 0.8rem; font-weight: bold; }
        
        .btn-nav { 
            background: rgba(217, 125, 84, 0.8); 
            backdrop-filter: blur(10px); 
            padding: 8px 20px; 
            border-radius: 10px; 
            color: white; 
            font-weight: bold; 
            text-decoration: none;
            animation: floatingBounce 3s ease-in-out infinite;
        }

        @keyframes floatingBounce { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-6px); } }

        /* HERO */
        .hero { 
            height: 60vh; 
            background: linear-gradient(rgba(0,0,0,0.5), rgba(0,0,0,0.5)), 
                        url('https://images.unsplash.com/photo-1504674900247-0877df9cc836?auto=format&fit=crop&w=1350&q=80'); 
            background-size: cover; 
            background-position: center; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
        }
        .hero h1 { font-family: 'DM Serif Display', serif; font-size: clamp(2rem, 6vw, 4rem); color: var(--white); text-align: center; }

        /* BARRA DE VALORES */
        .values-bar { background: var(--soft-peach); display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); padding: 40px 10%; text-align: center; gap: 30px; }
        .icon { font-size: 2.2rem; display: block; margin-bottom: 10px; }

        /* CARDÁPIO */
        .menu-section { background: var(--light-grey); padding: 80px 5%; text-align: center; }
        .menu-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 30px; max-width: 1200px; margin: 0 auto; }
        .card { background: var(--cream); border-radius: 20px; overflow: hidden; display: flex; flex-direction: column; transition: 0.4s; }
        .card-img { height: 250px; background-size: cover; background-position: center; }
        .btn-card { background: var(--terracotta); color: white; border: none; padding: 12px 30px; border-radius: 8px; font-weight: bold; }

        /* SLIDER DE BEBIDAS - AJUSTE PARA NÃO FICAR APERTADO */
        .drink-slider-section { padding: 100px 0; text-align: center; transition: background-color 0.8s ease; background-color: #fce4e3; position: relative; }
        .slider-container { display: flex; gap: 25px; min-height: 520px; padding: 0 10%; overflow-x: auto; scroll-snap-type: x mandatory; }
        .slider-container::-webkit-scrollbar { display: none; }
        
        .slide { 
            min-width: 280px; 
            height: 440px; 
            background: rgba(255, 255, 255, 0.2); 
            backdrop-filter: blur(15px); 
            border-radius: 40px; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            justify-content: space-between; /* Espalha os itens dentro do card */
            padding: 40px 20px; /* Mais respiro interno */
            scroll-snap-align: center; 
            transition: 0.5s; 
            opacity: 0.5; 
            transform: scale(0.9); 
        }
        .slide.active { opacity: 1; transform: scale(1); background: white; }
        
        /* Ajuste do tamanho da imagem da bebida */
        .drink-img { 
            max-width: 140px; /* Reduzi um pouco para dar mais espaço */
            height: auto; 
            max-height: 200px;
            object-fit: contain; 
        }
        
        .btn-drink { background: var(--terracotta); color: white; border: none; padding: 12px 30px; border-radius: 20px; font-weight: bold; margin-top: 10px; }

        /* ONDA E FOOTER */
        .wave-container { position: relative; background: var(--dark-green); height: 100px; margin-top: -100px; z-index: 5; }
        .wave svg { width: 100%; height: 100px; fill: #fce4e3; transition: fill 0.8s ease; }
        .main-footer { background: var(--dark-green); color: var(--white); padding: 80px 5% 40px; text-align: center; }
        .footer-content { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 40px; max-width: 1100px; margin: 0 auto; text-align: left; }
        .ifood-full-btn { background: var(--terracotta); color: white; text-decoration: none; display: block; width: 100%; max-width: 400px; margin: 40px auto 20px; padding: 20px; border-radius: 15px; font-weight: bold; text-align: center; }

        @media (max-width: 768px) { * { cursor: auto; } #custom-cursor { display: none; } .footer-content { text-align: center; } }
    </style>
</head>
<body>
    <div id="custom-cursor"></div>
    <nav class="navbar">
        <div class="logo">RAIZ</div>
        <div class="nav-links">
            <a href="#menu">Cardápio</a>
            <a href="#">História</a>
            <a href="#" class="btn-nav">iFood</a>
        </div>
    </nav>

    <header class="hero">
        <h1><span class="typing-effect">Sabor que vem da terra.</span></h1>
    </header>

    <section class="values-bar reveal">
        <div><span class="icon">🌿</span><h3>Puro</h3><p>Orgânicos locais.</p></div>
        <div><span class="icon">🖐️</span><h3>Artesanal</h3><p>Feito à mão.</p></div>
        <div><span class="icon">🚲</span><h3>Consciente</h3><p>Entrega rápida.</p></div>
    </section>

    <section id="menu" class="menu-section reveal">
        <h2>Cardápio Completo</h2>
        <div class="menu-grid">
            <div class="card">
                <div class="card-img" style="background-image: url('https://images.unsplash.com/photo-1568901346375-23c9450c58cd?auto=format&fit=crop&w=800&q=80');"></div>
                <div class="card-info">
                    <h3>Burger Raiz</h3>
                    <button class="btn-card">Pedir Agora</button>
                </div>
            </div>
            <div class="card">
                <div class="card-img" style="background-image: url('https://images.unsplash.com/photo-1546069901-ba9599a7e63c?auto=format&fit=crop&w=800&q=80');"></div>
                <div class="card-info">
                    <h3>Bowl da Estação</h3>
                    <button class="btn-card">Pedir Agora</button>
                </div>
            </div>
        </div>
    </section>

    <section id="especiais" class="drink-slider-section reveal">
        <h2>Especiais da Casa</h2>
        <div class="slider-container">
            <div class="slide" onclick="updateSlider(this, '#e74c3c')">
                <img src="coca.png" class="drink-img">
                <h3>Coca-Cola</h3>
                <button class="btn-drink">Pedir Agora</button>
            </div>
            <div class="slide" onclick="updateSlider(this, '#f39c12')">
                <img src="laranja.png" class="drink-img">
                <h3>Laranja</h3>
                <button class="btn-drink">Pedir Agora</button>
            </div>
            <div class="slide active" onclick="updateSlider(this, '#27ae60')">
                <img src="guarana.png" class="drink-img">
                <h3>Guaraná</h3>
                <button class="btn-drink">Pedir Agora</button>
            </div>
        </div>
    </section>

    <div class="wave-container"><div class="wave"><svg viewBox="0 0 1200 120" preserveAspectRatio="none"><path d="M321.39,56.44c58-10.79,114.16-30.13,172-41.86,82.39-16.72,168.19-17.73,250.45-.39C823.78,31,906.67,72,985.66,92.83c70.05,18.48,146.53,26.09,214.34,3V0H0V27.35A600.21,600.21,0,0,0,321.39,56.44Z"></path></svg></div></div>

    <footer class="main-footer">
        <div class="footer-content">
            <div class="footer-logo-section"><h2>RAIZ</h2></div>
            <div class="footer-column"><h4>Contato</h4><p>(11) 99999-9999</p></div>
        </div>
        <a href="#" class="ifood-full-btn">Peça no iFood</a>
    </footer>

    <script>
        const cursor = document.getElementById('custom-cursor');
        document.addEventListener('mousemove', e => { cursor.style.top = e.clientY + 'px'; cursor.style.left = e.clientX + 'px'; });

        function updateSlider(element, color) {
            document.querySelectorAll('.slide').forEach(s => s.classList.remove('active'));
            element.classList.add('active');
            document.getElementById('especiais').style.backgroundColor = color;
            document.querySelector('.wave svg path').style.fill = color;
        }

        function reveal() {
            document.querySelectorAll(".reveal").forEach(el => {
                if (el.getBoundingClientRect().top < window.innerHeight - 100) el.classList.add("active");
            });
        }
        window.addEventListener("scroll", reveal); reveal();
    </script>
</body>
</html>
