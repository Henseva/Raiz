<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Raiz - Sabor que vem da terra</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=Inter:wght@300;400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --dark-green: #2D4A3E;
            --soft-peach: #E9C4A6;
            --light-grey: #D9D9D9;
            --cream: #F5F1E3;
            --terracotta: #D97D54;
            --white: #FFFFFF;
            --whatsapp-green: #25D366;
            --open-color: #2ecc71;
            --closed-color: #e74c3c;
            --bg-body: var(--white);
            --text-main: var(--dark-green);
        }

        body.dark-mode {
            --bg-body: #0a0a0a;
            --text-main: #d1d1d1;
            --light-grey: #141414;
            --cream: #1a1a1a;
            --white: #0a0a0a;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; cursor: none; }
        body { font-family: 'Inter', sans-serif; color: var(--text-main); background: var(--bg-body); overflow-x: hidden; scroll-behavior: smooth; transition: background 0.5s ease; }

        #custom-cursor {
            width: 20px; height: 20px; border: 2px solid var(--terracotta);
            border-radius: 50%; position: fixed; pointer-events: none;
            z-index: 9999; transition: transform 0.1s ease-out;
            transform: translate(-50%, -50%);
        }

        .reveal { opacity: 0; transform: translateY(30px); transition: all 0.8s ease-out; }
        .reveal.active { opacity: 1; transform: translateY(0); }

        @keyframes typing { from { width: 0 } to { width: 100% } }
        .typing-effect { 
            display: inline-block; overflow: hidden; white-space: nowrap; 
            border-right: 3px solid var(--soft-peach);
            animation: typing 2.5s steps(30, end), blink .75s step-end infinite;
        }

        /* VAPOR */
        @keyframes steam {
            0% { transform: translate(-50%, 0) scale(1); opacity: 0; }
            40% { opacity: 0.4; }
            100% { transform: translate(-50%, -60px) scale(2); opacity: 0; }
        }
        .steam-effect::after {
            content: "☁"; font-size: 40px; position: absolute; 
            top: 15%; left: 50%; transform: translateX(-50%);
            color: rgba(255, 255, 255, 0.8); filter: blur(12px); 
            animation: steam 3s infinite; pointer-events: none; z-index: 10;
        }

        /* FOLHAS */
        .leaf { position: fixed; top: -10%; z-index: 9999; pointer-events: none; font-size: 20px; animation: fall linear forwards; }
        @keyframes fall { to { transform: translateY(110vh) rotate(360deg); } }

        /* NAVBAR */
        .navbar { background: var(--dark-green); padding: 10px 5%; display: flex; justify-content: space-between; align-items: center; color: #FFFFFF; position: sticky; top: 0; z-index: 1000; height: 60px; }
        .logo { font-family: 'DM Serif Display', serif; font-size: 1.6rem; letter-spacing: 2px; }

        .nav-status { font-size: 0.65rem; font-weight: bold; display: flex; align-items: center; gap: 5px; background: rgba(0,0,0,0.2); padding: 4px 10px; border-radius: 20px; margin-left: 15px; white-space: nowrap; }
        .nav-dot { width: 8px; height: 8px; border-radius: 50%; }
        @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.3; } 100% { opacity: 1; } }
        .dot-online { background-color: var(--open-color); box-shadow: 0 0 8px var(--open-color); animation: pulse 2s infinite; }
        .dot-offline { background-color: var(--closed-color); }

        .nav-links { display: flex; align-items: center; gap: 20px; margin-left: auto; }
        .nav-links a { color: #FFFFFF; text-decoration: none; font-size: 0.8rem; font-weight: bold; }
        .theme-switch, .sound-switch { cursor: pointer; font-size: 1.1rem; color: var(--soft-peach); transition: 0.3s; }
        .sound-switch.active { color: var(--whatsapp-green); text-shadow: 0 0 10px var(--whatsapp-green); }
        .btn-nav { background: var(--terracotta); padding: 8px 20px; border-radius: 10px; color: white !important; font-weight: bold; }

        /* BARRA DE VALORES (EXTRÁIDA DO SEU PRINT) */
        .values-bar { background: var(--soft-peach); display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); padding: 60px 10%; text-align: center; gap: 40px; color: var(--dark-green); }
        .icon { font-size: 3rem; display: block; margin-bottom: 15px; }
        .values-bar h3 { font-family: 'DM Serif Display', serif; margin-bottom: 10px; }

        /* CARDÁPIO */
        .menu-section { background: var(--light-grey); padding: 80px 5%; text-align: center; }
        .menu-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 30px; max-width: 1200px; margin: 0 auto; }
        .card { background: var(--cream); border-radius: 20px; overflow: hidden; display: flex; flex-direction: column; transition: 0.5s; position: relative; }
        .card-img-container { width: 100%; height: 250px; overflow: hidden; }
        .card-img { width: 100%; height: 100%; background-size: cover; background-position: center; transition: transform 0.8s ease; }
        .card:hover .card-img { transform: scale(1.1); } /* ACRÉSCIMO 1: Parallax */

        /* BOTÕES ORIGINAIS */
        .btn-card, .btn-drink { background: var(--terracotta); color: white; border: none; padding: 12px 30px; border-radius: 25px; font-weight: bold; cursor: pointer; transition: 0.3s; margin-top: 15px; display: inline-block; text-decoration: none; }
        .btn-card:hover, .btn-drink:hover { transform: translateY(-3px); box-shadow: 0 5px 15px rgba(217, 125, 84, 0.4); }

        /* ACRÉSCIMO 2: Micro-interação loading */
        .btn-card.loading::after, .btn-drink.loading::after { content: " ✓"; animation: pop 0.3s ease; }
        @keyframes pop { from { opacity: 0; scale: 0.5; } to { opacity: 1; scale: 1; } }

        /* SLIDER BEBIDAS */
        .drink-slider-section { padding: 80px 0; text-align: center; background-color: var(--light-grey); }
        .slider-container { display: flex; gap: 25px; padding: 0 10%; overflow-x: auto; scroll-snap-type: x mandatory; scrollbar-width: none; }
        .slide { min-width: 280px; background: rgba(255, 255, 255, 0.1); backdrop-filter: blur(10px); border-radius: 40px; padding: 40px 20px; scroll-snap-align: center; }
        .drink-img { height: 200px; object-fit: contain; margin-bottom: 20px; }

        .whatsapp-float { position: fixed; width: 60px; height: 60px; bottom: 20px; right: 20px; background-color: var(--whatsapp-green); color: #FFF; border-radius: 50px; z-index: 1000; display: flex; align-items: center; justify-content: center; font-size: 35px; box-shadow: 2px 2px 10px rgba(0,0,0,0.2); }
    </style>
</head>
<body>

    <div id="custom-cursor"></div>
    <audio id="natureSound" loop src="https://assets.mixkit.co/active_storage/sfx/2458/2458-preview.mp3"></audio>

    <a href="#" class="whatsapp-float"><i class="fab fa-whatsapp"></i></a>

    <nav class="navbar">
        <div class="logo">RAIZ</div>
        <div class="nav-links">
            <i class="fas fa-tree sound-switch" id="soundToggle" title="Som da Natureza"></i>
            <i class="fas fa-moon theme-switch" id="themeToggle"></i>
            <a href="#menu">Cardápio</a>
            <a href="#" class="btn-nav">iFood</a>
        </div>
    </nav>

    <header class="hero" style="height: 80vh; background: linear-gradient(rgba(0,0,0,0.4), rgba(0,0,0,0.4)), url('https://images.unsplash.com/photo-1504674900247-0877df9cc836?auto=format&fit=crop&w=1350&q=80'); background-size: cover; background-position: center; display: flex; align-items: center; justify-content: center;">
        <h1 style="color: white; font-family: 'DM Serif Display'; font-size: 3.5rem;"><span class="typing-effect">Sabor que vem da terra.</span></h1>
    </header>

    <section class="values-bar">
        <div><span class="icon">🌿</span><h3>Puro</h3><p>Orgânicos locais de produtores parceiros.</p></div>
        <div><span class="icon">🖐️</span><h3>Artesanal</h3><p>Cada detalhe feito à mão com carinho.</p></div>
        <div><span class="icon">🚲</span><h3>Consciente</h3><p>Embalagens biodegradáveis e entrega limpa.</p></div>
    </section>

    <section id="menu" class="menu-section">
        <div class="menu-grid">
            <div class="card steam-effect">
                <div class="card-img-container"><div class="card-img" style="background-image: url('https://images.unsplash.com/photo-1568901346375-23c9450c58cd?auto=format&fit=crop&w=800&q=80');"></div></div>
                <div class="card-info" style="padding: 20px;">
                    <h3>Burger Raiz</h3>
                    <p>Blend bovino 180g e queijo cura.</p>
                    <button class="btn-card" onclick="actionOrder(this)">Pedir Agora</button>
                </div>
            </div>
        </div>
    </section>

    <section id="especiais" class="drink-slider-section">
        <h2 style="margin-bottom: 40px; font-family: 'DM Serif Display'; font-size: 2.5rem;">Especiais da Casa</h2>
        <div class="slider-container">
            <div class="slide" style="background: #e74c3c22;">
                <img src="https://images.unsplash.com/photo-1622483767028-3f66f32aef97?auto=format&fit=crop&w=400&q=80" class="drink-img" style="border-radius: 20px;">
                <h3>Coca-Cola</h3>
                <button class="btn-drink" onclick="actionOrder(this)">Pedir Agora</button>
            </div>
        </div>
    </section>

    <script>
        const cursor = document.getElementById('custom-cursor');
        const themeToggle = document.getElementById('themeToggle');
        const soundToggle = document.getElementById('soundToggle');
        const natureSound = document.getElementById('natureSound');

        document.addEventListener('mousemove', e => {
            cursor.style.top = e.clientY + 'px';
            cursor.style.left = e.clientX + 'px';
        });

        themeToggle.addEventListener('click', () => {
            document.body.classList.toggle('dark-mode');
            themeToggle.classList.toggle('fa-sun');
        });

        soundToggle.addEventListener('click', () => {
            if (natureSound.paused) {
                natureSound.play();
                soundToggle.classList.add('active');
            } else {
                natureSound.pause();
                soundToggle.classList.remove('active');
            }
        });

        function actionOrder(btn) {
            btn.classList.add('loading');
            createLeaves();
            setTimeout(() => btn.classList.remove('loading'), 2000);
        }

        function createLeaves() {
            const leaves = ['🌿', '🍃', '🌱'];
            for(let i=0; i<15; i++) {
                const leaf = document.createElement('div');
                leaf.className = 'leaf';
                leaf.innerText = leaves[Math.floor(Math.random() * leaves.length)];
                leaf.style.left = Math.random() * 100 + 'vw';
                leaf.style.animationDuration = (Math.random() * 2 + 1) + 's';
                document.body.appendChild(leaf);
                setTimeout(() => leaf.remove(), 3000);
            }
        }
    </script>
</body>
</html>
