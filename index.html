<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Raiz - Sabor que vem da terra</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=Inter:wght@300;400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --dark-green: #2D4A3E;
            --soft-peach: #E9C4A6;
            --light-grey: #D9D9D9;
            --cream: #F5F1E3;
            --terracotta: #D97D54;
            --white: #FFFFFF;
            --whatsapp-green: #25D366;
            --open-color: #2ecc71;
            --closed-color: #e74c3c;
            --bg-body: var(--white);
            --text-main: var(--dark-green);
            --card-shadow: rgba(0,0,0,0.1);
        }

        body.dark-mode {
            --bg-body: #0a0a0a;
            --text-main: #f0f0f0;
            --light-grey: #121212;
            --cream: #1d1d1d;
            --white: #0a0a0a;
            --dark-green: #1a2e26;
            --card-shadow: rgba(255,255,255,0.05);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; cursor: none; }
        html { overflow-x: hidden; }
        body { 
            font-family: 'Inter', sans-serif; 
            color: var(--text-main); 
            background: var(--bg-body); 
            overflow-x: hidden; 
            max-width: 100vw; 
            scroll-behavior: smooth; 
            transition: background 0.5s ease, color 0.5s ease; 
        }

        /* Custom cursor style */
        #custom-cursor {
            width: 20px; height: 20px; border: 2px solid var(--terracotta);
            border-radius: 50%; position: fixed; pointer-events: none;
            z-index: 9999; transition: transform 0.1s ease-out;
            transform: translate(-50%, -50%);
        }

        .navbar { 
            background: var(--dark-green); 
            padding: 10px 5%; 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            color: #FFFFFF; 
            position: sticky; 
            top: 0; 
            z-index: 1000; 
            height: auto; /* Ajustado para auto */
            min-height: 54px; 
            flex-wrap: nowrap; 
            transition: height 0.3s ease, padding 0.3s ease, box-shadow 0.3s ease; 
        }

        .hero { 
            height: 60vh; 
            background: linear-gradient(rgba(0,0,0,0.6), rgba(0,0,0,0.6)), url('https://images.unsplash.com/photo-1504674900247-0877df9cc836?auto=format&fit=crop&w=1350&q=80'); 
            background-size: cover; 
            background-position: center; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            overflow: hidden; 
            padding: 0 5%; /* Adicionado padding */
        }

        .values-bar { 
            background: var(--soft-peach); 
            display: grid; 
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); 
            padding: 60px 5%; /* Ajustado o padding */
            text-align: center; 
            gap: 40px; 
            color: var(--dark-green); 
        }

        .menu-section { 
            background: var(--light-grey); 
            padding: 80px 5%; /* Ajustado o padding */
            text-align: center; 
            scroll-margin-top: 80px; 
        }

        /* Ensure images are responsive */
        .card-img { 
            max-width: 100%; 
            height: auto; 
            object-fit: cover; 
        }

        @media (max-width: 768px) {
            .navbar { 
                padding: 8px 4%; 
                flex-wrap: nowrap; 
            }
            .hero { 
                height: 50vh; 
                padding: 0 2%; /* Adicionado ajuste no padding */
            }
            .values-bar { 
                padding: 40px 6%; 
            }
            .menu-section { 
                padding: 50px 4%; 
            }
        }

        @media (max-width: 480px) {
            .menu-grid { 
                grid-template-columns: repeat(2, 1fr); 
                gap: 8px; 
            }
            .card-info { 
                padding: 12px; 
            }
            .price-tag { 
                font-size: 0.95rem; 
            }
        }
    </style>
</head>
<body>
    <!-- Conteúdo do seu site aqui -->
</body>
</html>
