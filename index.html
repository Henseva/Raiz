<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Raiz - Cardápio Compacto</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=Inter:wght@300;400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --dark-green: #2D4A3E;
            --soft-peach: #E9C4A6;
            --light-grey: #D9D9D9;
            --cream: #F5F1E3;
            --terracotta: #D97D54;
            --white: #FFFFFF;
            --whatsapp-green: #25D366;
            --bg-body: var(--white);
            --text-main: var(--dark-green);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; cursor: none; }
        body { font-family: 'Inter', sans-serif; color: var(--text-main); background: var(--bg-body); overflow-x: hidden; scroll-behavior: smooth; }

        #custom-cursor {
            width: 20px; height: 20px; border: 2px solid var(--terracotta);
            border-radius: 50%; position: fixed; pointer-events: none;
            z-index: 9999; transform: translate(-50%, -50%);
        }

        .leaf { position: fixed; top: -15%; z-index: 9999; pointer-events: none; font-size: 20px; animation: fall linear forwards; }
        @keyframes fall { to { transform: translateY(120vh) rotate(720deg); } }

        .navbar { background: var(--dark-green); padding: 10px 5%; display: flex; justify-content: space-between; align-items: center; color: #FFFFFF; position: sticky; top: 0; z-index: 1000; height: 60px; }
        .logo { font-family: 'DM Serif Display', serif; font-size: 1.6rem; letter-spacing: 2px; }

        /* HERO REDUZIDO */
        .hero { height: 40vh; background: linear-gradient(rgba(0,0,0,0.6), rgba(0,0,0,0.6)), url('https://images.unsplash.com/photo-1504674900247-0877df9cc836?auto=format&fit=crop&w=1350&q=80'); background-size: cover; background-position: center; display: flex; align-items: center; justify-content: center; }
        .hero h1 { font-family: 'DM Serif Display', serif; font-size: 3rem; color: #FFFFFF; }

        /* SEÇÃO DE CARDÁPIO COMPACTA */
        .menu-section { padding: 60px 5%; background: var(--light-grey); text-align: center; }
        .menu-grid { 
            display: grid; 
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); /* Cards menores */
            gap: 20px; 
            max-width: 1200px; 
            margin: 40px auto; 
        }

        .card { 
            background: var(--cream); 
            border-radius: 15px; 
            overflow: hidden; 
            transition: 0.3s; 
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            display: flex;
            flex-direction: column;
            border: 1px solid rgba(0,0,0,0.05);
        }

        .card:hover { transform: translateY(-5px); }

        .card-img-container { width: 100%; height: 160px; overflow: hidden; } /* Imagem menor */
        .card-img { width: 100%; height: 100%; background-size: cover; background-position: center; }

        .card-info { padding: 15px; display: flex; flex-direction: column; flex-grow: 1; }
        .card-info h3 { font-family: 'DM Serif Display', serif; font-size: 1.2rem; margin-bottom: 5px; }
        .card-info p { font-size: 0.8rem; opacity: 0.8; margin-bottom: 15px; height: 40px; overflow: hidden; }
        
        .price-tag { font-weight: bold; color: var(--terracotta); margin-bottom: 10px; display: block; }

        .btn-card { 
            background: var(--terracotta); 
            color: white; 
            border: none; 
            padding: 10px; 
            border-radius: 8px; 
            font-size: 0.8rem; 
            font-weight: bold; 
            cursor: pointer; 
            transition: 0.3s;
        }
        .btn-card:hover { background: var(--dark-green); }

        .ifood-full-btn { background: var(--terracotta); color: white; padding: 15px 30px; border-radius: 10px; text-decoration: none; font-weight: bold; display: inline-block; margin-top: 40px; }

        @media (max-width: 480px) {
            .menu-grid { grid-template-columns: repeat(2, 1fr); gap: 10px; } /* 2 por linha no celular */
            .card-info h3 { font-size: 1rem; }
            .card-img-container { height: 120px; }
        }
    </style>
</head>
<body>

    <div id="custom-cursor"></div>

    <nav class="navbar">
        <div class="logo">RAIZ</div>
    </nav>

    <header class="hero">
        <h1>Nosso Cardápio</h1>
    </header>

    <section class="menu-section">
        <div class="menu-grid">
            <div class="card">
                <div class="card-img-container"><div class="card-img" style="background-image: url('https://images.unsplash.com/photo-1568901346375-23c9450c58cd?auto=format&fit=crop&w=500');"></div></div>
                <div class="card-info">
                    <h3>Burger Raiz</h3>
                    <p>Blend 180g e queijo meia cura.</p>
                    <span class="price-tag">R$ 32,00</span>
                    <button class="btn-card" onclick="createLeaves(this)">Adicionar</button>
                </div>
            </div>

            <div class="card">
                <div class="card-img-container"><div class="card-img" style="background-image: url('https://images.unsplash.com/photo-1546069901-ba9599a7e63c?auto=format&fit=crop&w=500');"></div></div>
                <div class="card-info">
                    <h3>Bowl Veggie</h3>
                    <p>Mix de grãos e folhas da época.</p>
                    <span class="price-tag">R$ 28,00</span>
                    <button class="btn-card" onclick="createLeaves(this)">Adicionar</button>
                </div>
            </div>

            <div class="card">
                <div class="card-img-container"><div class="card-img" style="background-image: url('https://images.unsplash.com/photo-1512152272829-e3139592d56f?auto=format&fit=crop&w=500');"></div></div>
                <div class="card-info">
                    <h3>Fritas Rústicas</h3>
                    <p>Com alecrim e flor de sal.</p>
                    <span class="price-tag">R$ 18,00</span>
                    <button class="btn-card" onclick="createLeaves(this)">Adicionar</button>
                </div>
            </div>

            <div class="card">
                <div class="card-img-container"><div class="card-img" style="background-image: url('https://images.unsplash.com/photo-1594212699903-ec8a3eca50f5?auto=format&fit=crop&w=500');"></div></div>
                <div class="card-info">
                    <h3>Raiz Salad</h3>
                    <p>Tomates cereja e molho pesto.</p>
                    <span class="price-tag">R$ 24,00</span>
                    <button class="btn-card" onclick="createLeaves(this)">Adicionar</button>
                </div>
            </div>
        </div>

        <a href="#" class="ifood-full-btn" onclick="createLeaves(this)">Peça no iFood</a>
    </section>

    <script>
        const cursor = document.getElementById('custom-cursor');
        document.addEventListener('mousemove', e => {
            cursor.style.top = e.clientY + 'px';
            cursor.style.left = e.clientX + 'px';
        });

        function createLeaves(btn) {
            const leafCount = btn.classList.contains('ifood-full-btn') ? 400 : 30;
            const leaves = ['🌿', '🍃', '🌱', '☘️', '🍀'];
            for(let i=0; i < leafCount; i++) {
                const leaf = document.createElement('div');
                leaf.className = 'leaf';
                leaf.innerText = leaves[Math.floor(Math.random() * leaves.length)];
                leaf.style.left = Math.random() * 100 + 'vw';
                leaf.style.animationDelay = Math.random() * 3 + 's';
                leaf.style.fontSize = (Math.random() * 35 + 25) + 'px';
                leaf.style.animationDuration = (Math.random() * 2.5 + 2) + 's';
                document.body.appendChild(leaf);
                setTimeout(() => leaf.remove(), 6000);
            }
        }
    </script>
</body>
</html>
