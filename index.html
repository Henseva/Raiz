<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Raiz - Sabor Original</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }

        section {
            position: relative;
            width: 100%;
            min-height: 100vh;
            padding: 100px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #fff;
            overflow: hidden;
            transition: 0.5s;
        }

        .circle {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #e51e2a;
            clip-path: circle(600px at right 800px);
            z-index: 0;
            transition: 0.5s ease-in-out;
        }

        header {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            padding: 20px 100px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 100;
        }

        .logo { color: #333; font-weight: 700; text-decoration: none; font-size: 2em; }

        header ul { display: flex; }
        header ul li { list-style: none; }
        header ul li a { color: #333; text-decoration: none; margin-left: 40px; font-weight: 500; }

        .content {
            position: relative;
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 1;
        }

        .textBox { max-width: 600px; }
        .textBox h2 { color: #333; font-size: 4em; line-height: 1.2em; font-weight: 900; text-transform: uppercase; }
        .textBox h2 span { color: #e51e2a; font-size: 1.2em; transition: 0.5s; }
        .textBox p { color: #333; margin: 20px 0; }
        .textBox a {
            display: inline-block;
            padding: 10px 25px;
            background: #e51e2a;
            color: #fff;
            border-radius: 40px;
            font-weight: 500;
            text-decoration: none;
            transition: 0.5s;
        }

        .imgBox { width: 500px; display: flex; justify-content: flex-end; }
        .imgBox img { max-width: 330px; transition: 0.5s; filter: drop-shadow(0 15px 15px rgba(0,0,0,0.2)); }

        /* BEBIDAS LADO A LADO (Igual ao vídeo) */
        .thumb {
            position: absolute;
            left: 50%;
            bottom: 20px;
            transform: translateX(-50%);
            display: flex;
            z-index: 10;
        }

        .thumb li {
            list-style: none;
            margin: 0 15px;
            cursor: pointer;
            transition: 0.5s;
            background: rgba(255,255,255,0.1);
            padding: 10px;
            border-radius: 15px;
            backdrop-filter: blur(5px);
            border: 1px solid rgba(255,255,255,0.2);
        }

        .thumb li:hover { transform: translateY(-10px); background: rgba(255,255,255,0.3); }
        .thumb li img { width: 50px; }

        /* RESPONSIVIDADE */
        @media (max-width: 991px) {
            header { padding: 20px; }
            header ul { display: none; }
            section { padding: 150px 20px 100px; flex-direction: column; }
            .content { flex-direction: column; }
            .textBox { text-align: center; max-width: 100%; }
            .textBox h2 { font-size: 2.5em; }
            .imgBox { width: 100%; justify-content: center; margin-top: 50px; }
            .imgBox img { max-width: 250px; }
            .circle { clip-path: circle(400px at center bottom); }
        }
    </style>
</head>
<body>
    <section>
        <div class="circle"></div>
        <header>
            <a href="#" class="logo">Raiz</a>
            <ul>
                <li><a href="#">Home</a></li>
                <li><a href="#">Produtos</a></li>
            </ul>
        </header>

        <div class="content">
            <div class="textBox">
                <h2>Sabor que é <br><span id="spanText">Raiz</span></h2>
                <p>O verdadeiro frescor da garrafa de vidro. Uma experiência clássica.</p>
                <a href="#" id="btnColor">Saiba Mais</a>
            </div>
            <div class="imgBox">
                <img src="coca.png" id="sliderImg">
            </div>
        </div>

        <ul class="thumb">
            <li onclick="imgSlider('coca.png', '#e51e2a')"><img src="coca.png"></li>
            <li onclick="imgSlider('laranja.png', '#f28e1c')"><img src="laranja.png"></li>
            <li onclick="imgSlider('guarana.png', '#017143')"><img src="guarana.png"></li>
        </ul>
    </section>

    <script>
        function imgSlider(anything, color){
            document.querySelector('#sliderImg').src = anything;
            document.querySelector('.circle').style.background = color;
            document.querySelector('#spanText').style.color = color;
            document.querySelector('#btnColor').style.background = color;
        }
    </script>
</body>
</html>
