<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sabor Raiz | Refresco Premium</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;700;900&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }

        section {
            position: relative;
            width: 100%;
            min-height: 100vh;
            padding: 100px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #fff;
            overflow: hidden;
        }

        /* HEADER */
        header {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            padding: 20px 100px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 100;
        }

        .logo {
            color: #333;
            font-weight: 700;
            text-decoration: none;
            font-size: 2.5em;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        header ul {
            display: flex;
        }

        header ul li {
            list-style: none;
        }

        header ul li a {
            color: #333;
            text-decoration: none;
            margin-left: 40px;
            font-weight: 500;
            transition: 0.3s;
        }

        header ul li a:hover {
            color: #e51e2a; /* Cor muda no script */
        }

        /* CONTEÚDO PRINCIPAL */
        .content {
            position: relative;
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 1;
        }

        .textBox {
            position: relative;
            max-width: 600px;
            animation: fadeInText 1s ease-in-out;
        }

        .textBox h2 {
            color: #333;
            font-size: 4em;
            line-height: 1.2em;
            font-weight: 900;
            text-transform: uppercase;
        }

        .textBox h2 span {
            color: #e51e2a;
            font-size: 1.2em;
            transition: 0.5s;
        }

        .textBox p {
            color: #333;
            font-size: 1.1em;
            margin: 20px 0;
        }

        .textBox a {
            display: inline-block;
            padding: 12px 35px;
            background: #e51e2a; 
            color: #fff;
            border-radius: 40px;
            font-weight: 600;
            letter-spacing: 1px;
            text-decoration: none;
            transition: 0.5s;
            box-shadow: 0 10px 20px rgba(0,0,0,0.1);
        }

        .textBox a:hover {
            transform: scale(1.05);
        }

        /* IMAGEM E ANIMAÇÕES */
        .imgBox {
            width: 600px;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
        }

        /* Efeito de flutuar constante na garrafa */
        .imgBox img {
            max-width: 420px;
            transition: 0.5s ease;
            filter: drop-shadow(0 20px 30px rgba(0,0,0,0.2));
            animation: float 4s ease-in-out infinite;
        }

        /* Classe disparada via JS para efeito de troca */
        .img-fade {
            animation: imgSwap 0.6s ease-in-out;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-20px); }
        }

        @keyframes imgSwap {
            0% { opacity: 0; transform: scale(0.8) translateY(50px); }
            100% { opacity: 1; transform: scale(1) translateY(0); }
        }

        @keyframes fadeInText {
            0% { opacity: 0; transform: translateX(-50px); }
            100% { opacity: 1; transform: translateX(0); }
        }

        /* MINIATURAS */
        .thumb {
            position: absolute;
            left: 50%;
            bottom: 30px;
            transform: translateX(-50%);
            display: flex;
            z-index: 100;
        }

        .thumb li {
            list-style: none;
            margin: 0 15px;
            cursor: pointer;
            transition: 0.5s;
            background: rgba(255,255,255,0.2);
            padding: 10px;
            border-radius: 15px;
            backdrop-filter: blur(5px);
            border: 1px solid rgba(255,255,255,0.4);
        }

        .thumb li:hover {
            transform: translateY(-15px) scale(1.1);
            background: rgba(255,255,255,0.4);
        }

        .thumb li img {
            max-width: 50px;
        }

        /* CÍRCULO DE FUNDO */
        .circle {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #e51e2a;
            clip-path: circle(600px at right 800px);
            transition: 0.8s cubic-bezier(0.645, 0.045, 0.355, 1);
        }
    </style>
</head>
<body>
    <section class="main">
        <div class="circle"></div>
        
        <header>
            <a href="#" class="logo">Raiz</a>
            <ul>
                <li><a href="#">Home</a></li>
                <li><a href="#">Produtos</a></li>
                <li><a href="#">Sobre</a></li>
                <li><a href="#">Contato</a></li>
            </ul>
        </header>

        <div class="content">
            <div class="textBox">
                <h2>Sabor que é <br><span id="spanText">Raiz</span></h2>
                <p>O verdadeiro frescor da garrafa de vidro. Uma experiência clássica para quem valoriza o sabor autêntico e momentos refrescantes.</p>
                <a href="#" id="btnColor">Saiba Mais</a>
            </div>
            <div class="imgBox">
                <img src="coca.png" id="sliderImg">
            </div>
        </div>

        <ul class="thumb">
            <li><img src="coca.png" onclick="updateSlider('coca.png', '#e51e2a')"></li>
            <li><img src="laranja.png" onclick="updateSlider('laranja.png', '#f28e1c')"></li>
            <li><img src="guarana.png" onclick="updateSlider('guarana.png', '#017143')"></li>
        </ul>
    </section>

    <script>
        function updateSlider(filename, color) {
            const img = document.querySelector('#sliderImg');
            
            // 1. Aplica animação de troca na imagem
            img.classList.remove('img-fade');
            void img.offsetWidth; // Truque para resetar animação CSS
            img.classList.add('img-fade');
            
            // 2. Troca a imagem
            img.src = filename;

            // 3. Troca as cores
            document.querySelector('.circle').style.background = color;
            document.querySelector('#spanText').style.color = color;
            document.querySelector('#btnColor').style.background = color;
        }
    </script>
</body>
</html>
