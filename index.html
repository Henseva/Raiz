<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Raiz - Gastronomia de Origem</title>
    <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=Inter:wght@300;400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --dark-green: #2D4A3E;
            --soft-peach: #E9C4A6;
            --cream: #F5F1E3;
            --terracotta: #D97D54;
            --white: #FFFFFF;
        }

        body { margin: 0; font-family: 'Inter', sans-serif; background: var(--cream); color: var(--dark-green); overflow-x: hidden; }

        /* Navbar fixa */
        .navbar { background: var(--dark-green); padding: 15px 50px; display: flex; justify-content: space-between; align-items: center; color: white; position: sticky; top: 0; z-index: 1000; }
        .logo { font-family: 'DM Serif Display', serif; font-size: 1.8rem; letter-spacing: 2px; }

        /* SLIDER ESTILO VÍDEO */
        .drink-slider-section {
            padding: 100px 0;
            text-align: center;
            transition: background-color 0.8s cubic-bezier(0.4, 0, 0.2, 1);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            background-color: var(--soft-peach); /* Cor inicial */
        }

        .drink-slider-section h2 {
            font-family: 'DM Serif Display', serif;
            font-size: 3rem;
            margin-bottom: 60px;
            transition: color 0.5s;
        }

        .slider-container {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 40px;
            perspective: 1000px;
        }

        .slide {
            min-width: 280px;
            height: 400px;
            background: rgba(255, 255, 255, 0.2);
            backdrop-filter: blur(10px);
            border-radius: 30px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            transition: all 0.6s cubic-bezier(0.4, 0, 0.2, 1);
            opacity: 0.4;
            transform: scale(0.8) rotateY(15deg);
            position: relative;
            border: 1px solid rgba(255, 255, 255, 0.3);
        }

        .slide.active {
            opacity: 1;
            transform: scale(1.1) rotateY(0deg);
            background: white;
            box-shadow: 0 30px 60px rgba(0,0,0,0.15);
            z-index: 10;
        }

        .slide-content span {
            font-weight: bold;
            font-size: 1.2rem;
            margin-bottom: 10px;
            display: block;
        }

        .slide-content h3 {
            font-family: 'DM Serif Display', serif;
            font-size: 1.8rem;
            margin: 10px 0;
        }

        /* Ajuste das garrafas para flutuarem */
        .drink-img {
            width: 160px;
            height: auto;
            filter: drop-shadow(0 20px 30px rgba(0,0,0,0.2));
            transition: transform 0.5s ease;
        }

        .slide.active .drink-img {
            transform: translateY(-20px) scale(1.1);
        }

        .slider-nav { margin-top: 60px; }
        .slider-nav button {
            background: var(--dark-green);
            color: white;
            border: none;
            width: 60px;
            height: 60px;
            border-radius: 50%;
            cursor: pointer;
            font-size: 1.5rem;
            margin: 0 20px;
            transition: 0.3s;
            box-shadow: 0 10px 20px rgba(0,0,0,0.1);
        }
        .slider-nav button:hover { transform: scale(1.1); background: var(--terracotta); }

        @media (max-width: 768px) {
            .slider-container { flex-direction: column; gap: 80px; }
            .slide { min-width: 80%; }
        }
    </style>
</head>
<body>

    <nav class="navbar">
        <div class="logo">RAIZ</div>
        <div style="font-weight: bold;">Especiais</div>
    </nav>

    <section class="drink-slider-section" id="bgSection">
        <h2 id="sliderTitle">Escolha seu Raiz</h2>
        
        <div class="slider-container">
            <div class="slide active" data-color="#E9C4A6" data-text="#2D4A3E">
                <div class="slide-content">
                    <span>01</span>
                    <h3>Smoothie Berry</h3>
                    <img src="https://ouch-cdn2.icons8.com/6U83_6uUqWl3hF6mXzI_4U6W2kYvI3J7tq5Wq5Wq5Wq/rs:fit:456:456/czM6Ly9pY29uczgu/b3VjaC1wcm9kLmFz/c2V0cy9wbmcvOTU1/LzE0ZTQ1YjRjLTk0/MDItNDk0Zi1hYjE3/LTY4M2JkOTk4YjY5/Ni5wbmc.png" class="drink-img" alt="Smoothie">
                </div>
            </div>

            <div class="slide" data-color="#D97D54" data-text="#FFFFFF">
                <div class="slide-content">
                    <span>02</span>
                    <h3>Suco Vitalidade</h3>
                    <img src="https://ouch-cdn2.icons8.com/V9X2A_H3T0_3Bf7I-z4f1_U8k1_7M1U7yL5f3f3f3f3/rs:fit:456:456/czM6Ly9pY29uczgu/b3VjaC1wcm9kLmFz/c2V0cy9wbmcvNDM1/LzU3ZDVmZTQxLWZi/MmEtNDY4Zi1hYzEy/LTI3ZGU0ZDY4ZTE0/NS5wbmc.png" class="drink-img" alt="Suco">
                </div>
            </div>

            <div class="slide" data-color="#2D4A3E" data-text="#F5F1E3">
                <div class="slide-content">
                    <span>03</span>
                    <h3>Detox Raiz</h3>
                    <img src="https://ouch-cdn2.icons8.com/f2_B9T2-M1M1-z4f1_U8k1_7M1U7yL5f3f3f3f3/rs:fit:456:456/czM6Ly9pY29uczgu/b3VjaC1wcm9kLmFz/c2V0cy9wbmcvMzE1/LzE0ZTQ1YjRjLTk0/MDItNDk0Zi1hYjE3/LTY4M2JkOTk4YjY5/Ni5wbmc.png" class="drink-img" alt="Detox">
                </div>
            </div>
        </div>

        <div class="slider-nav">
            <button onclick="changeSlide(-1)">❮</button>
            <button onclick="changeSlide(1)">❯</button>
        </div>
    </section>

    <script>
        let current = 0;
        const slides = document.querySelectorAll('.slide');
        const bg = document.getElementById('bgSection');
        const title = document.getElementById('sliderTitle');

        function changeSlide(n) {
            // Remove classe ativa do atual
            slides[current].classList.remove('active');
            
            // Calcula o próximo
            current = (current + n + slides.length) % slides.length;
            
            // Adiciona classe ativa no novo
            slides[current].classList.add('active');
            
            // Pega as cores do novo slide
            const newBg = slides[current].getAttribute('data-color');
            const newText = slides[current].getAttribute('data-text');
            
            // Aplica a transição
            bg.style.backgroundColor = newBg;
            title.style.color = newText;
        }
    </script>
</body>
</html>
