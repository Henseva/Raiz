<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Raiz - Experiência Premium</title>
    <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=Inter:wght@400;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-default: #f5f1e3;
            --coca: #e74c3c;
            --fanta: #f39c12;
            --guarana: #27ae60;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body { 
            font-family: 'Inter', sans-serif; 
            background-color: var(--bg-default);
            overflow: hidden; 
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            transition: background 0.6s cubic-bezier(0.4, 0, 0.2, 1);
        }

        /* Texto de Fundo Estilo Revista */
        .bg-text {
            position: absolute;
            font-size: 25vw;
            font-weight: 900;
            color: rgba(255, 255, 255, 0.2);
            text-transform: uppercase;
            z-index: 1;
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.5s, transform 0.8s;
            transform: scale(0.8);
        }

        .active-bg .bg-text {
            opacity: 1;
            transform: scale(1);
        }

        /* Container dos Cards */
        .container {
            display: flex;
            gap: 20px;
            z-index: 10;
            width: 90%;
            max-width: 1100px;
            height: 500px;
            align-items: center;
        }

        .card {
            flex: 1;
            height: 100%;
            background: white;
            border-radius: 40px;
            cursor: pointer;
            position: relative;
            transition: all 0.6s cubic-bezier(0.4, 0, 0.2, 1);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            padding: 40px 20px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.05);
            overflow: hidden;
        }

        /* Quando o card é expandido */
        .card.expanded {
            flex: 4;
            background: transparent;
            box-shadow: none;
        }

        .card.expanded .card-info, .card.expanded .btn-view {
            opacity: 0;
            pointer-events: none;
        }

        /* Imagem do Produto */
        .product-img {
            width: 120px;
            z-index: 5;
            transition: all 0.6s cubic-bezier(0.4, 0, 0.2, 1);
            filter: drop-shadow(0 10px 20px rgba(0,0,0,0.1));
        }

        .card.expanded .product-img {
            width: 320px;
            transform: translateY(-20px);
            filter: drop-shadow(0 30px 50px rgba(0,0,0,0.3));
        }

        /* Detalhes do Card */
        .card-info { text-align: center; }
        .card-info span { font-size: 0.8rem; font-weight: bold; opacity: 0.3; }
        .card-info h3 { font-family: 'DM Serif Display', serif; font-size: 1.5rem; margin-top: 5px; }

        .btn-view {
            font-size: 0.7rem;
            font-weight: bold;
            text-transform: uppercase;
            border-bottom: 2px solid #000;
            padding-bottom: 2px;
        }

        /* Preço e Botão de Fechar (Aparecem na expansão) */
        .expanded-content {
            position: absolute;
            bottom: 40px;
            left: 50%;
            transform: translateX(-50%);
            opacity: 0;
            transition: 0.4s;
            text-align: center;
        }

        .card.expanded .expanded-content {
            opacity: 1;
        }

        .price { font-size: 2.5rem; font-weight: 900; color: white; margin-bottom: 15px; display: block; }
        .btn-buy {
            background: white;
            color: black;
            padding: 15px 40px;
            border-radius: 50px;
            text-decoration: none;
            font-weight: bold;
            font-size: 0.9rem;
        }

        /* Cores dos Cards no Hover/Active */
        .card-coca:hover { border: 2px solid var(--coca); }
        .card-fanta:hover { border: 2px solid var(--fanta); }
        .card-guarana:hover { border: 2px solid var(--guarana); }

        /* Responsivo Mobile */
        @media (max-width: 768px) {
            body { overflow-y: auto; height: auto; padding: 40px 0; }
            .container { flex-direction: column; height: auto; }
            .card { width: 100%; height: 400px; flex: none; }
            .card.expanded { height: 600px; }
            .bg-text { font-size: 40vw; top: 20%; }
        }
    </style>
</head>
<body id="body">

    <div class="bg-text" id="bg-title">RAIZ</div>

    <div class="container">
        
        <div class="card card-coca" onclick="expandCard(this, 'var(--coca)', 'COCA')">
            <div class="card-info">
                <span>01</span>
                <h3>Coca-Cola</h3>
            </div>
            <img src="coca.png" class="product-img">
            <div class="btn-view">Ver Detalhes</div>
            <div class="expanded-content">
                <span class="price">R$ 8,90</span>
                <a href="#" class="btn-buy">ADICIONAR AO PEDIDO</a>
            </div>
        </div>

        <div class="card card-fanta" onclick="expandCard(this, 'var(--fanta)', 'ORANGE')">
            <div class="card-info">
                <span>02</span>
                <h3>Laranja</h3>
            </div>
            <img src="laranja.png" class="product-img">
            <div class="btn-view">Ver Detalhes</div>
            <div class="expanded-content">
                <span class="price">R$ 7,50</span>
                <a href="#" class="btn-buy">ADICIONAR AO PEDIDO</a>
            </div>
        </div>

        <div class="card card-guarana" onclick="expandCard(this, 'var(--guarana)', 'BRAZIL')">
            <div class="card-info">
                <span>03</span>
                <h3>Guaraná</h3>
            </div>
            <img src="guarana.png" class="product-img">
            <div class="btn-view">Ver Detalhes</div>
            <div class="expanded-content">
                <span class="price">R$ 7,50</span>
                <a href="#" class="btn-buy">ADICIONAR AO PEDIDO</a>
            </div>
        </div>

    </div>

    <script>
        function expandCard(card, color, text) {
            const body = document.getElementById('body');
            const bgTitle = document.getElementById('bg-title');
            
            // Se clicar no card que já está expandido, ele volta ao normal
            if (card.classList.contains('expanded')) {
                card.classList.remove('expanded');
                body.style.background = 'var(--bg-default)';
                body.classList.remove('active-bg');
                return;
            }

            // Remove expansão de outros cards
            document.querySelectorAll('.card').forEach(c => c.classList.remove('expanded'));
            
            // Expande o atual
            card.classList.add('expanded');
            body.style.background = color;
            bgTitle.innerText = text;
            body.classList.add('active-bg');
        }
    </script>
</body>
</html>
