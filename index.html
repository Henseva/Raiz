<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Raiz - Sabor que vem da terra</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=Inter:wght@300;400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --dark-green: #2D4A3E;
            --soft-peach: #E9C4A6;
            --light-grey: #D9D9D9;
            --cream: #F5F1E3;
            --terracotta: #D97D54;
            --white: #FFFFFF;
            --whatsapp-green: #25D366;
            --open-color: #2ecc71;
            --closed-color: #e74c3c;
            --bg-body: var(--white);
            --text-main: var(--dark-green);
            --card-shadow: rgba(0,0,0,0.1);
        }

        body.dark-mode {
            --bg-body: #0a0a0a;
            --text-main: #f0f0f0;
            --light-grey: #121212;
            --cream: #1d1d1d;
            --white: #0a0a0a;
            --dark-green: #1a2e26;
            --card-shadow: rgba(255,255,255,0.05);
        }

        /* Removi o 'cursor: none' geral para garantir que você consiga usar o site enquanto desenvolve */
        * { box-sizing: border-box; margin: 0; padding: 0; }
        
        html { overflow-x: hidden; }
        body { font-family: 'Inter', sans-serif; color: var(--text-main); background: var(--bg-body); overflow-x: hidden; max-width: 100vw; scroll-behavior: smooth; transition: background 0.5s ease, color 0.5s ease; }

        /* Navbar */
        .navbar { background: var(--dark-green); padding: 10px 5%; display: flex; justify-content: space-between; align-items: center; color: #FFFFFF; position: sticky; top: 0; z-index: 1000; height: 60px; transition: 0.3s; }
        .logo { font-family: 'DM Serif Display', serif; font-size: 1.6rem; letter-spacing: 2px; }
        
        .nav-links { display: flex; align-items: center; gap: 15px; }
        .nav-links a { color: #FFFFFF; text-decoration: none; font-size: 0.8rem; font-weight: bold; }

        .hero { height: 60vh; background: linear-gradient(rgba(0,0,0,0.6), rgba(0,0,0,0.6)), url('https://images.unsplash.com/photo-1504674900247-0877df9cc836?auto=format&fit=crop&w=1350&q=80'); background-size: cover; background-position: center; display: flex; align-items: center; justify-content: center; color: white; }

        /* Banner Promoção */
        #promo-banner { 
            background: linear-gradient(90deg,#b5451b,var(--terracotta),#e8925a,var(--terracotta),#b5451b); 
            background-size:300% 100%; 
            animation:bannerSlide 5s linear infinite; 
            color:#fff; padding:9px 50px; font-size:0.82rem; font-weight:bold; 
            display:flex; align-items:center; justify-content:center; gap:12px; 
            position:relative; z-index:1001; 
        }
        @keyframes bannerSlide { 0%{background-position:0% 50%} 100%{background-position:300% 50%} }
        
        .promo-close { position:absolute; right:14px; top:50%; transform:translateY(-50%); background:none; border:none; color:#fff; cursor:pointer; }

        @media (max-width: 768px) {
            .navbar { padding: 8px 4%; }
            .nav-links a:not(.btn-nav) { display: none; }
            .hero h1 { font-size: 2rem; }
        }
    </style>
</head>
<body>

    <div id="promo-banner">
        <span class="promo-highlight">PROMOÇÃO DE HOJE</span> 
        <span>Sabor da terra com 20% OFF!</span>
        <button class="promo-close" onclick="this.parentElement.style.display='none'">×</button>
    </div>

    <nav class="navbar">
        <div class="logo">RAIZ</div>
        <div class="nav-links">
            <a href="#menu">MENU</a>
            <a href="#" class="btn-nav">PEDIR AGORA</a>
        </div>
    </nav>

    <header class="hero">
        <h1>Sabor que vem da terra</h1>
    </header>

    <main>
        </main>

    <a href="https://wa.me/seunumeroaqui" class="whatsapp-float" target="_blank">
        <i class="fab fa-whatsapp"></i>
    </a>

    <script>
        // Script básico para garantir que o site funcione bem no celular
        window.addEventListener('scroll', function() {
            const nav = document.querySelector('.navbar');
            if (window.scrollY > 50) {
                nav.style.height = '50px';
                nav.style.boxShadow = '0 4px 10px rgba(0,0,0,0.1)';
            } else {
                nav.style.height = '60px';
                nav.style.boxShadow = 'none';
            }
        });
    </script>
</body>
</html>
